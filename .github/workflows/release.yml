# Push a tag like v1.0.0 and GitHub builds YT2MP3.exe and attaches it to a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: YT2MP3.exe
      - name: Keep as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT2MP3
          path: YT2MP3.exe
