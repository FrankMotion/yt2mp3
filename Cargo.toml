[package]
name = "corvus"
version = "1.4.0"
description = "YouTube-Link rein, Musik oder Video raus. Minimal, nativ, wenig RAM."
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
native-windows-gui = { version = "1.0.13", features = ["high-dpi", "embed-resource", "file-dialog", "notice", "progress-bar", "menu", "cursor"] }
native-windows-derive = "1.0.5"
sha2 = "0.10"

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# Build with scripts/build.ps1: it keeps local folder names (C:\Users\<name>\...)
# out of the .exe (Cargo's trim-paths is not stable yet).
