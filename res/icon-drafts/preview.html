<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1b1b1f;color:#ddd;font:15px Segoe UI,sans-serif;padding:18px}
.row{display:flex;gap:36px;align-items:flex-end;margin-bottom:22px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{display:flex;gap:14px;align-items:center;padding:8px 14px;border-radius:6px}
.dark{background:#202020}.light{background:#f3f3f3}
h3{margin:0 0 6px;font-weight:600}
img.s16{width:16px;height:16px}img.s32{width:32px;height:32px}
</style></head><body>
<div class="row">
 <div class="col"><h3>A · Kopf</h3><img src="a-kopf.svg" width="200"></div>
 <div class="col"><h3>B · Sitzend</h3><img src="b-sitzend.svg" width="200"></div>
 <div class="col"><h3>C · Schimmer</h3><img src="c-schimmer.svg" width="200"></div>
</div>
<div>Taskleiste (32 px und 16 px), dunkel und hell:</div>
<div class="row" style="margin-top:8px">
 <div class="bar dark"><img class="s32" src="a-kopf.svg"><img class="s32" src="b-sitzend.svg"><img class="s32" src="c-schimmer.svg"><img class="s16" src="a-kopf.svg"><img class="s16" src="b-sitzend.svg"><img class="s16" src="c-schimmer.svg"></div>
 <div class="bar light"><img class="s32" src="a-kopf.svg"><img class="s32" src="b-sitzend.svg"><img class="s32" src="c-schimmer.svg"><img class="s16" src="a-kopf.svg"><img class="s16" src="b-sitzend.svg"><img class="s16" src="c-schimmer.svg"></div>
</div>
</body></html>
